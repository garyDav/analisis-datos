services:
  mysql:
    image: mysql:8.0
    container_name: mysql-titanic
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: titanic_ds
    ports:
      - "3307:3306"
    volumes:
      - mysql_titanic_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

volumes:
  mysql_titanic_data:
